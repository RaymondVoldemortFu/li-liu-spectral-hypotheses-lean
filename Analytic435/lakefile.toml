name = "goldbachSpectralAnalytic"
version = "1.0.0"
defaultTargets = ["AnalyticAudit", "ExistenceAudit"]

[[require]]
name = "conditionalGoldbach"
git = "https://github.com/subfish-zhou/conditional-goldbach-lean.git"
rev = "c55db645f3b4aed00374fe4aa1fcee2428c88c4b"
subDir = "formalization"

[[lean_lib]]
name = "AnalyticAudit"
roots = ["ActualLimits", "BetaSampling", "Characters", "Kernel", "Residues", "Progressions", "BetaCross", "Diagonal", "Quadratic", "Samples", "Gram", "Entry", "Energy", "Opposite", "PrimeLower", "PhysicalAP", "SpectralTestsAtScale", "PrimeMass", "SmoothShift", "ShiftMean", "RowMean", "ModulusWitness", "AtWindow", "OriginalBounds", "SpectralRefutation", "OriginalStatements", "PositiveWidth", "ArithmeticWidths", "PaperPremise", "FiniteSamples", "SparsePrescriptions", "ShortShiftLimit", "BandPNT", "AnalyticAudit"]

[[lean_lib]]
name = "ExistenceAudit"
roots = ["ExistenceAudit", "ExistenceLocalization", "PhysicalSupport", "ModelDecay", "StripDecay", "ConductorMoments", "ConductorCorrection", "DiagonalPole", "SecondMoment", "MomentTruncation", "PerronApproximation", "PerronHardy", "PerronOperators", "PerronDiagonal", "PrimeResidual", "PrimeCorrelations", "SquareResidues", "SquareCorrelations", "SquareRemoval", "PowerRemoval", "PrimeHyperbola"]

[[lean_lib]]
name = "SpectralTests"
srcDir = ".."
roots = ["SpectralTests.Widths", "SpectralTests.Singular", "SpectralTests.Obstruction", "SpectralTests.WindowSize", "SpectralTests.Parameters", "SpectralTests.LayerGrowth", "SpectralTests.BandWitness", "SpectralTests.RowShape", "SpectralTests.RowChange", "SpectralTests.PrimeProgression", "SpectralTests.Weights", "SpectralTests.TestEnergy", "SpectralTests.ShiftDefinitions", "SpectralTests.BandMass", "SpectralTests.BandMatrix", "SpectralTests.BandRows", "SpectralTests.BandPrimes", "SpectralTests.Lattice", "SpectralTests.BandSieve", "SpectralTests.Thresholds"]

